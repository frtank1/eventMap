name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_Code
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detekt
        run: ./gradlew detekt

      - name: Tests
        run: ./gradlew allTests

      - name: Assemble Android (debug)
        run: ./gradlew :composeApp:assembleDebug

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_Backend/server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + tests
        run: ./gradlew build
