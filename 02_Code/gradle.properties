#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Отключаем кэш компилятора Kotlin/Native — он падал на material3 alpha-klib
# («Failed to build cache for ...»). Сборка чуть медленнее, но стабильна.
kotlin.native.cacheKind=none

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# configuration-cache конфликтует с KotlinNativeCompile (libraries$delegate) — выкл.
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true