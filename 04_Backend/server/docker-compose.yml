services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventmap
      POSTGRES_USER: eventmap
      POSTGRES_PASSWORD: eventmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on: [db]
    environment:
      DB_URL: jdbc:postgresql://db:5432/eventmap
      DB_USER: eventmap
      DB_PASSWORD: eventmap
      JWT_SECRET: dev-secret-change-me
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
