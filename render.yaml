# EventMap backend — Render Blueprint (БЕСПЛАТНЫЙ деплой).
#
# Free web-сервис + платная база Postgres (Basic-256mb), деплой автоматически по push в main.
# Прежняя двух-окруженческая версия (staging free + prod paid) сохранена в истории git.
#
# Web на free-плане засыпает после 15 мин простоя (~30 сек холодный старт) — таймауты клиента
# подняты под это. База — платная Basic-256mb (~$6/мес), 30-дневного лимита free больше нет.
#
# Подключить: Render → New → Blueprint → выбрать этот репозиторий → Apply.

databases:
  - name: eventmap-db
    databaseName: eventmap
    user: eventmap
    # Basic-256mb (~$6/мес) — постоянная база без 30-дневной смерти free-плана.
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: eventmap
    runtime: docker
    rootDir: 04_Backend/server
    dockerfilePath: ./Dockerfile
    branch: main
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # dev — чтобы не требовался CORS_HOSTS (в free-тесте разрешён anyHost).
      - key: APP_ENV
        value: dev
      - key: PORT
        value: "8080"
      # DATABASE_URL → AppConfig сам разберёт в jdbc + user + password.
      - key: DATABASE_URL
        fromDatabase:
          name: eventmap-db
          property: connectionString
      # Медиа-хостинг: без S3_* работает фолбэк в Postgres (V10) — фото/видео
      # хранятся в БД, ссылки строятся от RENDER_EXTERNAL_URL (Render задаёт сам).
      # Для прод-хостинга в Cloudflare R2 добавить в Dashboard → Environment:
      #   S3_ENDPOINT, S3_REGION=auto, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY, S3_PUBLIC_BASE
      # Инструкция: 05_Docs/STORAGE_SETUP.md
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: eventmap
      - key: JWT_AUDIENCE
        value: eventmap-app
