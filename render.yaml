# EventMap backend — Render Blueprint (БЕСПЛАТНЫЙ деплой).
#
# Один free web-сервис + одна free-база Postgres, деплой автоматический по push в main.
# Карта/оплата не нужны — все ресурсы на free-плане.
# Прежняя двух-окруженческая версия (staging free + prod paid) сохранена в истории git.
#
# Ограничения free-тарифа: сервис засыпает после 15 мин простоя (~30 сек холодный старт),
# free-Postgres живёт 30 дней. Для теста/демо — ок; для прода позже вернуть платные планы.
#
# Подключить: Render → New → Blueprint → выбрать этот репозиторий → Apply.

databases:
  - name: eventmap-db
    databaseName: eventmap
    user: eventmap
    plan: free
    region: frankfurt

services:
  - type: web
    name: eventmap
    runtime: docker
    rootDir: 04_Backend/server
    dockerfilePath: ./Dockerfile
    branch: main
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # dev — чтобы не требовался CORS_HOSTS (в free-тесте разрешён anyHost).
      - key: APP_ENV
        value: dev
      - key: PORT
        value: "8080"
      # DATABASE_URL → AppConfig сам разберёт в jdbc + user + password.
      - key: DATABASE_URL
        fromDatabase:
          name: eventmap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: eventmap
      - key: JWT_AUDIENCE
        value: eventmap-app
