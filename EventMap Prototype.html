  function setStatus(msg) { if (loading) loading.textContent = msg; }

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');

    const blobUrls = {};

      const entry = manifest[uuid];

        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);

            const reader = ds.readable.getReader();

            writer.close();

            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

2.5px;font-weight:800\">Онбординг<\u002Fdiv><div style=\"font-size:10px;color:#7e8d9f;font-weight:700\">A2–A4<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div onclick=\"{{ goInterests }}\" style=\"background:#11212f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:11px;display:flex;align-items:center;gap:10px;cursor:pointer\"><div style=\"width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3a2466,#FF5C8A);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto\">🎯<\u002Fdiv><div style=\"min-width:0\"><div style=\"font-size:12.5px;font-weight:800\">Выбор интересов<\u002Fdiv><div style=\"font-size:10px;color:#7e8d9f;font-weight:700\">A8<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div onclick=\"{{ goProfile }}\" style=\"background:#11212f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:11px;display:flex;align-items:center;gap:10px;cursor:pointer\"><div style=\"width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7C5CFF,#FF5C8A);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto\">🦊<\u002Fdiv><div style=\"min-width:0\"><div style=\"font-size:12.5px;font-weight:800\">Мой профиль<\u002Fdiv><div style=\"font-size:10px;color:#7e8d9f;font-weight:700\">H1<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div onclick=\"{{ goSubs }}\" style=\"background:#11212f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:11px;display:flex;align-items:center;gap:10px;cursor:pointer\"><div style=\"width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#243650,#a78bff);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto\">📌<\u002Fdiv><div style=\"min-width:0\"><div style=\"font-size:12.5px;font-weight:800\">Мои подписки<\u002Fdiv><div style=\"font-size:10px;color:#7e8d9f;font-weight:700\">F1<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div onclick=\"{{ goNotifs }}\" style=\"background:#11212f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:11px;display:flex;align-items:center;gap:10px;cursor:pointer\"><div style=\"width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#243650,#FF5C8A);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto\">🔔<\u002Fdiv><div style=\"min-width:0\"><div style=\"font-size:12.5px;font-weight:800\">Уведомления<\u002Fdiv><div style=\"font-size:10px;color:#7e8d9f;font-weight:700\">F4<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div onclick=\"{{ goSearch }}\" style=\"background:#11212f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:11px;display:flex;align-items:center;gap:10px;cursor:pointer\"><div style=\"width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#243650,#5DCAA5);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto\">🔍<\u002Fdiv><div style=\"min-width:0\"><div style=\"font-size:12.5px;font-weight:800\">Поиск<\u002Fdiv><div style=\"font-size:10px;color:#7e8d9f;font-weight:700\">G2<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ GALLERY FAB (persistent) ============ -->\n  <sc-if value=\"{{ showGalleryFab }}\" hint-placeholder-val=\"\">\n  <div onclick=\"{{ openGallery }}\" style=\"position:absolute;right:14px;bottom:92px;z-index:118;width:46px;height:46px;border-radius:14px;background:rgba(17,33,47,.92);backdrop-filter:blur(10px);border:1px solid rgba(167,139,255,.35);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 22px rgba(0,0,0,.5);cursor:pointer\">⊞<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ BOTTOM NAV ============ -->\n  <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:55;height:74px;background:rgba(10,20,32,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 6px\">\n    <div onclick=\"{{ goMap }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\"><span style=\"font-size:20px\">🗺️<\u002Fspan><span style=\"font-size:10px;font-weight:700;color:{{ navMap }}\">Карта<\u002Fspan><\u002Fdiv>\n    <div onclick=\"{{ goNow }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\"><span style=\"font-size:20px\">⚡<\u002Fspan><span style=\"font-size:10px;font-weight:700;color:#7e8d9f\">Сейчас<\u002Fspan><\u002Fdiv>\n    <div onclick=\"{{ goRecord }}\" style=\"flex:0 0 auto;margin:0 8px\"><div style=\"width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#7C5CFF,#FF5C8A);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 22px rgba(124,92,255,.45);margin-top:-14px\">🎬<\u002Fdiv><\u002Fdiv>\n    <div onclick=\"{{ goQuest }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\"><span style=\"font-size:20px\">🎮<\u002Fspan><span style=\"font-size:10px;font-weight:700;color:{{ navQuest }}\">Квесты<\u002Fspan><\u002Fdiv>\n    <div onclick=\"{{ goProfile }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\"><span style=\"font-size:20px\">👤<\u002Fspan><span style=\"font-size:10px;font-weight:700;color:{{ navProfile }}\">Профиль<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TOAST ============ -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"\">\n  <div style=\"position:absolute;left:50%;bottom:210px;transform:translateX(-50%);z-index:120;background:#5DCAA5;color:#06231a;font-weight:800;font-size:13px;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:sheetUp .3s;white-space:nowrap\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'onboarding',\n    onb: 0,\n    mapMode: 'pulse',\n    liveSheet: false,\n    reelIndex: 0,\n    expanded: false,\n    tickets: 2,\n    liked: false,\n    belled: false,\n    qProgress: 2,\n    toast: '',\n  };\n\n  onbSlides = [\n    { emoji: '🗺️', title: 'Карта живых событий вокруг', sub: 'Не «что будет», а что живёт прямо сейчас — концерты, забеги, скидки и люди на одной карте города.' },\n    { emoji: '🎯', title: 'Подписывайся на жанры и людей', sub: 'Забеги, детское, квизы, акции на еду. Карта и лента подстроятся под тебя.' },\n    { emoji: '🎬', title: 'Делись моментами', sub: 'Снимай 30-секундные рилсы в моменте — они появятся на карте и в галерее события.' },\n  ];\n\n  events = [\n    { emoji: '🎧', org: 'Rooftop 360', orgEmoji: '🎛️', cat: '🎵 Ночная жизнь', live: true, count: 230, price: 0, time: '01:12 идёт', place: 'Rooftop 360', dist: '240 м', grad: 'radial-gradient(120% 90% at 50% 20%,#3a2466,#12132a 62%,#05070d)' },\n    { emoji: '🎤', org: 'Бар «Подвал»', orgEmoji: '🍺', cat: '😂 Стендап', live: false, count: 48, price: 0, time: 'сегодня 19:00', place: 'Панфилова 120', dist: '650 м', grad: 'radial-gradient(120% 90% at 50% 22%,#2a1c4d,#161a2e 62%,#05070d)' },\n    { emoji: '🎷', org: 'Rooftop 360', orgEmoji: '🎺', cat: '🎶 Джаз', live: false, count: 120, price: 3000, time: 'сегодня 20:00', place: 'Rooftop 360', dist: '240 м', grad: 'radial-gradient(120% 90% at 50% 22%,#3d2f18,#1c2233 60%,#05070d)' },\n  ];\n\n  go(screen, extra) { this.setState({ screen, liveSheet: false, expanded: false, ...(extra || {}) }); }\n\n  nextR() { this.setState(s => ({ reelIndex: (s.reelIndex + 1) % this.events.length, expanded: false, liked: false, belled: false })); }\n  prevR() { this.setState(s => ({ reelIndex: (s.reelIndex - 1 + this.events.length) % this.events.length, expanded: false, liked: false, belled: false })); }\n\n  showToast(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 1900);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const slide = this.onbSlides[s.onb];\n    const ev = this.events[s.reelIndex];\n    const paid = ev.price > 0;\n    const dotC = i => (i === s.onb ? '#7C5CFF' : '#2a3346');\n    const dotW = i => (i === s.onb ? '24px' : '6px');\n    const modeBg = m => (s.mapMode === m ? 'linear-gradient(135deg,#7C5CFF,#FF5C8A)' : 'transparent');\n    const modeFg = m => (s.mapMode === m ? '#fff' : '#8a93ad');\n\n    return {\n      // screen flags\n      isOnboarding: s.screen === 'onboarding',\n      isMap: s.screen === 'map',\n      isReel: s.screen === 'reel',\n      isPay: s.screen === 'pay',\n      isSuccess: s.screen === 'success',\n      isQuest: s.screen === 'quest',\n      isCheckin: s.screen === 'checkin',\n      isRecord: s.screen === 'record',\n      isProfile: s.screen === 'profile',\n      isGallery: s.screen === 'gallery',\n      isMapDay: s.screen === 'mapDay',\n      isHeatmap: s.screen === 'heatmap',\n      isPeople: s.screen === 'people',\n      isEmptyMap: s.screen === 'emptyMap',\n      isFilters: s.screen === 'filters',\n      isHub: s.screen === 'hub',\n      isCatalog: s.screen === 'catalog',\n      isFinish: s.screen === 'finish',\n      isRating: s.screen === 'rating',\n      isNotifs: s.screen === 'notifs',\n      isSubs: s.screen === 'subs',\n      isSearch: s.screen === 'search',\n      isInterests: s.screen === 'interests',\n      isComments: s.screen === 'comments',\n      isShare: s.screen === 'share',\n      liveSheet: s.liveSheet,\n      expanded: s.expanded,\n      showNav: ['map', 'mapDay', 'heatmap', 'people', 'emptyMap', 'quest', 'catalog', 'profile', 'hub', 'subs', 'notifs', 'search'].includes(s.screen),\n      showGalleryFab: ['mapDay', 'heatmap', 'people', 'emptyMap', 'catalog', 'profile', 'hub', 'subs', 'notifs', 'search'].includes(s.screen),\n      toast: s.toast,\n\n      // onboarding\n      onbEmoji: slide.emoji,\n      onbTitle: slide.title,\n      onbSub: slide.sub,\n      onbBtn: s.onb === 2 ? 'Начать 🚀' : 'Дальше →',\n      dotC0: dotC(0), dotC1: dotC(1), dotC2: dotC(2),\n      dotW0: dotW(0), dotW1: dotW(1), dotW2: dotW(2),\n      onbNext: () => (s.onb === 2 ? this.go('map') : this.setState({ onb: s.onb + 1 })),\n      goMap: () => this.go('map'),\n\n      // map modes\n      isPulse: s.mapMode === 'pulse',\n      isFlow: s.mapMode === 'flow',\n      isFog: s.mapMode === 'fog',\n      showSpont: s.mapMode !== 'fog',\n      pulseBg: modeBg('pulse'), pulseFg: modeFg('pulse'),\n      flowBg: modeBg('flow'), flowFg: modeFg('flow'),\n      fogBg: modeBg('fog'), fogFg: modeFg('fog'),\n      modePulse: () => this.setState({ mapMode: 'pulse' }),\n      modeFlow: () => this.setState({ mapMode: 'flow' }),\n      modeFog: () => this.setState({ mapMode: 'fog' }),\n\n      // map -> destinations\n      openLive: () => this.setState({ liveSheet: true }),\n      closeSheet: () => this.setState({ liveSheet: false }),\n      openLiveReel: () => this.go('reel', { reelIndex: 0 }),\n      openReelStandup: () => this.go('reel', { reelIndex: 1 }),\n      openReelJazz: () => this.go('reel', { reelIndex: 2 }),\n      goQuest: () => this.go('quest'),\n      goRecord: () => this.go('record'),\n      goProfile: () => this.go('profile'),\n      goNow: () => this.go('reel', { reelIndex: 0 }),\n      openGallery: () => this.go('gallery'),\n      goDay: () => this.go('mapDay'),\n      goHeat: () => this.go('heatmap'),\n      goPeople: () => this.go('people'),\n      goEmpty: () => this.go('emptyMap'),\n      goFilters: () => this.go('filters'),\n      goHub: () => this.go('hub'),\n      goCatalog: () => this.go('catalog'),\n      goFinish: () => this.go('finish'),\n      goRating: () => this.go('rating'),\n      goNotifs: () => this.go('notifs'),\n      goSubs: () => this.go('subs'),\n      goSearch: () => this.go('search'),\n      goInterests: () => this.go('interests'),\n      goComments: () => this.go('comments'),\n      goShare: () => this.go('share'),\n      openMapPulse: () => { this.setState({ mapMode: 'pulse' }); this.go('map'); },\n      openMapFlow: () => { this.setState({ mapMode: 'flow' }); this.go('map'); },\n      openMapFog: () => { this.setState({ mapMode: 'fog' }); this.go('map'); },\n      goOnb: () => this.go('onboarding', { onb: 0 }),\n      openLiveSheet: () => { this.go('map'); this.setState({ liveSheet: true }); },\n      goPayScreen: () => this.go('pay'),\n      goSuccessScreen: () => this.go('success'),\n      goReel: () => this.go('reel', { reelIndex: 0 }),\n\n      // reel\n      evEmoji: ev.emoji, evOrg: ev.org, evOrgEmoji: ev.orgEmoji, evCat: ev.cat,\n      evLive: ev.live, evCount: ev.count, evTitle: this._title(s.reelIndex),\n      evPlace: ev.place, evDist: ev.dist, evTime: ev.time, evGrad: ev.grad,\n      evMeta: '📍 ' + ev.place + ' · ' + ev.dist + ' · ' + ev.time,\n      evCatOrg: ev.cat + ' · ' + ev.org + ' ✓',\n      evGoing: ev.count + ' идут',\n      likeIcon: s.liked ? '❤️' : '🤍', likeCount: s.liked ? '1.3k' : '1.2k',\n      bellIcon: s.belled ? '🔔' : '🔕',\n      likeEv: () => this.setState({ liked: !s.liked }),\n      ringBell: () => { this.setState({ belled: !s.belled }); this.showToast(s.belled ? 'Напоминание выключено' : '✓ Напомним за час до начала'); },\n      nextReel: () => this.nextR(),\n      toggleExpanded: () => this.setState({ expanded: !s.expanded }),\n      reelWheel: (e) => { if (s.expanded) return; const now = Date.now(); if (now - (this._lw || 0) < 650) return; if (Math.abs(e.deltaY) < 12) return; this._lw = now; e.deltaY > 0 ? this.nextR() : this.prevR(); },\n      reelTouchStart: (e) => { this._ty = e.touches[0].clientY; },\n      reelTouchEnd: (e) => { if (s.expanded) return; const dy = e.changedTouches[0].clientY - (this._ty || 0); if (dy < -45) this.nextR(); else if (dy > 45) this.prevR(); },\n      evPriceLabel: paid ? ev.price + ' ₸' : 'Бесплатно',\n      priceChipBg: paid ? 'rgba(250,199,117,.16)' : 'rgba(93,202,165,.16)',\n      priceChipFg: paid ? '#FAC775' : '#5DCAA5',\n      ctaLabel: paid ? ('🎟️ Купить · ' + ev.price + ' ₸') : (ev.live ? '📍 Я тоже здесь' : '🙋 Приду'),\n      ctaBg: paid ? 'linear-gradient(135deg,#FAC775,#e0632e)' : (ev.live ? 'linear-gradient(135deg,#FF4757,#FF5C8A)' : 'linear-gradient(135deg,#7C5CFF,#FF5C8A)'),\n      ctaShadow: paid ? '0 10px 26px rgba(224,99,46,.34)' : (ev.live ? '0 10px 26px rgba(255,71,87,.34)' : '0 10px 26px rgba(124,92,255,.34)'),\n      geoStatus: ev.live ? '✓ локация совпадает · можно отметиться' : (paid ? 'покупка = ты в списке «идут»' : 'напомним и добавим в «идут»'),\n      ctaPress: (e) => {\n        if (e && e.stopPropagation) e.stopPropagation();\n        if (paid) { this.go('pay'); }\n        else if (ev.live) { this.go('record'); }\n        else { this.showToast('✓ Ты в списке «идут»'); }\n      },\n\n      // payment\n      ticketCount: s.tickets,\n      payTotal: (s.tickets * 3000).toLocaleString('ru-RU'),\n      payTotalCur: (s.tickets * 3000).toLocaleString('ru-RU') + ' ₸',\n      payBtnLabel: 'Оплатить · ' + (s.tickets * 3000).toLocaleString('ru-RU') + ' ₸',\n      itogoLabel: 'Итого · ' + s.tickets + ' × 3000 ₸',\n      ticketsLabel: s.tickets + ' × взрослый',\n      incTicket: () => this.setState({ tickets: Math.min(9, s.tickets + 1) }),\n      decTicket: () => this.setState({ tickets: Math.max(1, s.tickets - 1) }),\n      payNow: () => this.go('success'),\n      backToReel: () => this.go('reel', { reelIndex: 2 }),\n\n      // quest\n      qProgress: s.qProgress,\n      qPercent: (s.qProgress / 4 * 100) + '%',\n      goCheckin: () => this.go('checkin'),\n      doCheckin: () => { this.setState({ qProgress: Math.min(4, s.qProgress + 1) }); this.showToast('✓ Точка засчитана! Фото в галерее'); this.go('quest', { qProgress: Math.min(4, s.qProgress + 1) }); },\n\n      // record\n      publishVideo: () => { this.showToast('✓ Видео опубликовано в событие'); this.go('map'); },\n\n      // nav colors\n      navMap: s.screen === 'map' ? '#fff' : '#7e8d9f',\n      navQuest: s.screen === 'quest' ? '#fff' : '#7e8d9f',\n      navProfile: s.screen === 'profile' ? '#fff' : '#7e8d9f',\n    };\n  }\n\n  _title(i) {\n    return ['Night Beats · DJ-сет на крыше', 'Стендап-вечер · Open Mic', 'Jazz на крыше · вечер'][i];\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
